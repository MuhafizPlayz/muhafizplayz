<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Episodes | Muhafız Playz Admin</title>
<link rel="stylesheet" href="admin.css?v=20261006">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Episodes</h1>
        <p class="sub" id="count">Loading...</p>
      </div>
      <button class="btn primary" id="newBtn" type="button">+ Add Episode</button>
    </div>

    <div class="card hide" id="formCard">
      <h2 id="formTitle">Add Episode</h2>
      <form id="form">
        <div class="form-grid">
          <div>
            <label class="l" for="drama_id">Drama</label>
            <select id="drama_id" required></select>
          </div>
          <div>
            <label class="l" for="episode_number">Episode Number</label>
            <input type="number" id="episode_number" min="1" required>
          </div>
          <div>
            <label class="l" for="title">Title</label>
            <input type="text" id="title">
          </div>
          <div>
            <label class="l" for="release_date">Release Date</label>
            <input type="date" id="release_date">
          </div>
          <div class="full">
            <label class="l" for="thumbnail_url">Thumbnail (URL ya upload)</label>
            <input type="text" id="thumbnail_url" placeholder="https://...">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px">
              <button class="btn sm" type="button" id="thumb_btn">Upload from phone / gallery</button>
              <input type="file" id="thumb_file" accept="image/*" style="display:none">
              <span class="t-sub" id="thumb_status"></span>
            </div>
            <img id="thumb_preview" alt="" style="display:none;margin-top:10px;max-width:160px;max-height:160px;border-radius:8px;border:1px solid #2c2c44;object-fit:cover">
          </div>
          <div class="full">
            <label class="l" for="description">Description</label>
            <textarea id="description"></textarea>
          </div>
          <div class="full">
            <label class="l" for="server1_url">Server 1 URL</label>
            <input type="text" id="server1_url">
          </div>
          <div>
            <label class="l" for="download_480_url">480p Download URL</label>
            <input type="text" id="download_480_url">
          </div>
          <div>
            <label class="l" for="download_720_url">720p Download URL</label>
            <input type="text" id="download_720_url">
          </div>
          <div>
            <label class="l" for="download_1080_url">1080p Download URL</label>
            <input type="text" id="download_1080_url">
          </div>
        </div>

        <div class="checks">
          <label><input type="checkbox" id="published"> Published</label>
        </div>

        <div class="form-actions">
          <button class="btn primary" type="submit" id="saveBtn">Save Episode</button>
          <button class="btn" type="button" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search drama or episode...">
        <select id="filterDrama"><option value="">All dramas</option></select>
      </div>
      <div class="table-wrap" id="list">Loading...</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=20261006"></script>
<script src="../js/auth.js?v=20261006"></script>
<script src="admin.js?v=20261006"></script>
<script>
var editId = null;
var eps = [];
var FIELDS = ["drama_id", "episode_number", "title", "thumbnail_url", "description", "release_date", "server1_url", "download_480_url", "download_720_url", "download_1080_url"];

function $(id) { return document.getElementById(id); }

function openForm(ep) {
  editId = ep ? ep.id : null;
  $("formTitle").textContent = ep ? "Edit Episode" : "Add Episode";
  $("form").reset();
  if (ep) {
    FIELDS.forEach(function (k) { $(k).value = ep[k] == null ? "" : ep[k]; });
    $("published").checked = !!ep.published;
  } else if ($("filterDrama").value) {
    $("drama_id").value = $("filterDrama").value;
  }
  $("formCard").classList.remove("hide");
  $("episode_number").focus();
  window.scrollTo(0, 0);
}

function closeForm() {
  editId = null;
  $("form").reset();
  $("formCard").classList.add("hide");
}

function render() {
  var term = $("search").value.trim().toLowerCase();
  var drama = $("filterDrama").value;

  var rows = eps.filter(function (e) {
    if (drama && String(e.drama_id) !== drama) return false;
    if (term) {
      var hay = ((e.dramas && e.dramas.title) || "") + " " + (e.title || "") + " " + e.episode_number;
      if (hay.toLowerCase().indexOf(term) === -1) return false;
    }
    return true;
  });

  $("count").textContent = eps.length + " total, showing " + rows.length;

  var box = $("list");
  if (!rows.length) {
    box.innerHTML = '<div class="empty-state">No episodes found.</div>';
    return;
  }

  box.innerHTML = "<table><tr><th>Drama</th><th>Episode</th><th>Links</th><th>Status</th><th>Actions</th></tr>" +
    rows.map(function (e) {
      var links = (e.server1_url ? '<span class="badge blue">Stream</span> ' : "") +
        (e.download_480_url ? '<span class="badge gray">480p</span> ' : "") +
        (e.download_720_url ? '<span class="badge gray">720p</span> ' : "") +
        (e.download_1080_url ? '<span class="badge gray">1080p</span>' : "");
      var id = esc(e.id);
      return "<tr><td class=\"t-title\">" + esc((e.dramas && e.dramas.title) || "-") + "</td>" +
        "<td><div class=\"t-title\">Episode " + esc(e.episode_number) + "</div><div class=\"t-sub\">" + esc(e.title || "") + "</div></td>" +
        "<td>" + (links || '<span class="t-sub">No links</span>') + "</td>" +
        "<td>" + (e.published ? '<span class="badge green">Published</span>' : '<span class="badge gray">Draft</span>') + "</td>" +
        "<td><div class=\"actions\">" +
        "<button class=\"btn sm\" data-act=\"edit\" data-id=\"" + id + "\">Edit</button>" +
        "<button class=\"btn sm\" data-act=\"toggle\" data-id=\"" + id + "\">" + (e.published ? "Unpublish" : "Publish") + "</button>" +
        "<button class=\"btn sm danger\" data-act=\"del\" data-id=\"" + id + "\">Delete</button>" +
        "</div></td></tr>";
    }).join("") + "</table>";
}

async function loadDramas() {
  var res = await supabaseClient.from("dramas").select("id,title").order("title");
  if (res.error) { toast(res.error.message, "err"); return; }
  var opts = (res.data || []).map(function (d) { return '<option value="' + esc(d.id) + '">' + esc(d.title) + "</option>"; }).join("");
  $("drama_id").innerHTML = opts;
  $("filterDrama").innerHTML = '<option value="">All dramas</option>' + opts;
}

async function load() {
  var res = await supabaseClient.from("episodes").select("*,dramas(title)").order("created_at", { ascending: false });
  if (res.error) {
    $("list").innerHTML = '<div class="empty-state">' + esc(res.error.message) + "</div>";
    $("count").textContent = "Error";
    return;
  }
  eps = res.data || [];
  render();
}

$("list").addEventListener("click", async function (e) {
  var btn = e.target.closest("button[data-act]");
  if (!btn) return;
  var ep = eps.find(function (x) { return String(x.id) === btn.dataset.id; });
  if (!ep) return;

  if (btn.dataset.act === "edit") {
    openForm(ep);
  } else if (btn.dataset.act === "toggle") {
    var r = await supabaseClient.from("episodes").update({ published: !ep.published }).eq("id", ep.id);
    if (r.error) toast(r.error.message, "err");
    else { toast(ep.published ? "Episode unpublished." : "Episode published."); load(); }
  } else if (btn.dataset.act === "del") {
    if (!confirm("Delete Episode " + ep.episode_number + "? This cannot be undone.")) return;
    var r2 = await supabaseClient.from("episodes").delete().eq("id", ep.id);
    if (r2.error) toast(r2.error.message, "err");
    else { toast("Episode deleted."); load(); }
  }
});

$("newBtn").addEventListener("click", function () { openForm(null); });
$("cancelBtn").addEventListener("click", closeForm);
$("search").addEventListener("input", render);
$("filterDrama").addEventListener("change", render);

$("form").addEventListener("submit", async function (e) {
  e.preventDefault();
  var obj = {
    drama_id: $("drama_id").value,
    episode_number: Number($("episode_number").value),
    title: $("title").value.trim() || null,
    thumbnail_url: $("thumbnail_url").value.trim() || null,
    description: $("description").value.trim() || null,
    release_date: $("release_date").value || null,
    server1_url: $("server1_url").value.trim() || null,
    download_480_url: $("download_480_url").value.trim() || null,
    download_720_url: $("download_720_url").value.trim() || null,
    download_1080_url: $("download_1080_url").value.trim() || null,
    published: $("published").checked
  };
  if (!obj.drama_id || !obj.episode_number) { toast("Drama and episode number are required.", "err"); return; }

  $("saveBtn").disabled = true;
  var q = editId
    ? supabaseClient.from("episodes").update(obj).eq("id", editId)
    : supabaseClient.from("episodes").insert(obj);
  var r = await q;
  $("saveBtn").disabled = false;

  if (r.error) { toast(r.error.message, "err"); return; }
  toast("Episode saved.");
  closeForm();
  load();
});


/* ---------- Image upload (mobile gallery/camera -> Supabase Storage) ---------- */
function compressImage(file, maxSide) {
  return new Promise(function (resolve) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, maxSide / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.round(w * scale); c.height = Math.round(h * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { resolve(b ? { blob: b, type: "image/jpeg", ext: "jpg" } : null); }, "image/jpeg", 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

async function uploadImage(file, folder) {
  var packed = await compressImage(file, 1000);
  var body, type, ext;
  if (packed) { body = packed.blob; type = packed.type; ext = packed.ext; }
  else {
    body = file; type = file.type || "image/jpeg";
    ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
  }
  var path = folder + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;
  var up = await supabaseClient.storage.from("posters").upload(path, body, { contentType: type, upsert: false });
  if (up.error) throw up.error;
  return supabaseClient.storage.from("posters").getPublicUrl(path).data.publicUrl;
}

function setupUpload(cfg) {
  var input = $(cfg.urlId), file = $(cfg.fileId), btn = $(cfg.btnId), st = $(cfg.statusId), prev = $(cfg.previewId);
  function preview() {
    var v = input.value.trim();
    if (v) { prev.src = v; prev.style.display = "block"; } else { prev.removeAttribute("src"); prev.style.display = "none"; }
  }
  prev.onerror = function () { prev.style.display = "none"; };
  input.addEventListener("input", preview);
  btn.addEventListener("click", function () { file.click(); });
  file.addEventListener("change", async function () {
    var f = file.files && file.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name)) { toast("Please choose an image file.", "err"); file.value = ""; return; }
    btn.disabled = true; st.textContent = "Uploading...";
    try {
      input.value = await uploadImage(f, cfg.folder);
      st.textContent = "Uploaded. Ab Save dabayein.";
      toast("Image uploaded.");
    } catch (err) {
      st.textContent = "";
      toast("Upload failed: " + (err.message || err), "err");
    }
    btn.disabled = false; file.value = ""; preview();
  });
  return preview;
}

var updateThumbPreview = setupUpload({ urlId: "thumbnail_url", fileId: "thumb_file", btnId: "thumb_btn", statusId: "thumb_status", previewId: "thumb_preview", folder: "episodes" });
var _openForm = openForm, _closeForm = closeForm;
openForm = function (ep) { _openForm(ep); $("thumb_status").textContent = ""; updateThumbPreview(); };
closeForm = function () { _closeForm(); $("thumb_status").textContent = ""; updateThumbPreview(); };
$("cancelBtn").removeEventListener("click", _closeForm);
$("cancelBtn").addEventListener("click", function () { closeForm(); });

(async function () {
  var ok = await requireAdmin();
  if (!ok) return;
  renderNav("episodes");
  await loadDramas();
  load();
})();
</script>
</body>
</html>
