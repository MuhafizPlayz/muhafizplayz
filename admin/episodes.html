<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Episodes | Muhafız Playz</title><style>body{margin:0;background:#0e0e0f;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 30px));margin:auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.top a,.top button,.btn{padding:10px 14px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}.panel{background:#171719;border:1px solid #29292c;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #333;background:#101011;color:#fff;margin:6px 0 12px}label{display:block;color:#bbb;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #29292c;text-align:left}button.danger{background:#7a2020;color:#fff}.msg{color:#aaa;margin:8px 0}.hide{display:none}</style></head><body>
<div class="wrap"><div class="top"><h1>Episodes</h1><div><a href="index.html">Dashboard</a> <button onclick="logoutUser()">Logout</button></div></div><div class="panel"><form id="form"><input type="hidden" id="id"><label>Drama</label><select id="drama_id" required></select><label>Episode Number</label><input id="episode_number" type="number" min="1" required><label>Title</label><input id="title"><label>Thumbnail URL</label><input id="thumbnail_url"><label>Description</label><textarea id="description"></textarea><label>Release Date</label><input id="release_date" type="date"><label>Server 1 URL</label><input id="server1_url"><label>480p Download URL</label><input id="download_480_url"><label>720p Download URL</label><input id="download_720_url"><label>1080p Download URL</label><input id="download_1080_url"><label><input id="published" type="checkbox"> Published</label><button class="btn" type="submit">Save Episode</button><button class="btn" type="button" onclick="resetForm()">New</button><div class="msg" id="msg"></div></form></div><div class="panel"><div id="list">Loading...</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><script>let editId=null;
async function loadDramas(){let {data,error}=await supabaseClient.from("dramas").select("id,title").order("title");if(error){msg.textContent=error.message;return}drama_id.innerHTML=(data||[]).map(d=>`<option value="${d.id}">${d.title}</option>`).join("")}
function resetForm(){editId=null;form.reset();id.value=""}
async function load(){let r=await checkAdmin();if(!r.isAdmin){location.href="../login.html";return}await loadDramas();let {data,error}=await supabaseClient.from("episodes").select("*,dramas(title)").order("created_at",{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=`<table><tr><th>Drama</th><th>Episode</th><th>Published</th><th>Action</th></tr>${(data||[]).map(e=>`<tr><td>${e.dramas?.title||""}</td><td>${e.episode_number}</td><td>${e.published?"Yes":"No"}</td><td><button onclick='edit(${JSON.stringify(e)})'>Edit</button> <button class="danger" onclick="del('${e.id}')">Delete</button></td></tr>`).join("")}</table>`}
function edit(e){editId=e.id;for(const k of ["drama_id","episode_number","title","thumbnail_url","description","release_date","server1_url","download_480_url","download_720_url","download_1080_url"])document.getElementById(k).value=e[k]??"";published.checked=!!e.published;scrollTo(0,0)}
async function del(id){if(!confirm("Delete this episode?"))return;let {error}=await supabaseClient.from("episodes").delete().eq("id",id);if(error)alert(error.message);else load()}
form.onsubmit=async e=>{e.preventDefault();let obj={drama_id:drama_id.value,episode_number:Number(episode_number.value),title:title.value.trim()||null,thumbnail_url:thumbnail_url.value.trim()||null,description:description.value.trim()||null,release_date:release_date.value||null,server1_url:server1_url.value.trim()||null,download_480_url:download_480_url.value.trim()||null,download_720_url:download_720_url.value.trim()||null,download_1080_url:download_1080_url.value.trim()||null,published:published.checked};let q=editId?supabaseClient.from("episodes").update(obj).eq("id",editId):supabaseClient.from("episodes").insert(obj);let {error}=await q;if(error)msg.textContent=error.message;else{msg.textContent="Saved.";resetForm();load()}}
load();</script></body></html>
