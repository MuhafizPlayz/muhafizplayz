<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categories | Muhafız Playz</title><style>body{margin:0;background:#0e0e0f;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 30px));margin:auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.top a,.top button,.btn{padding:10px 14px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}.panel{background:#171719;border:1px solid #29292c;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #333;background:#101011;color:#fff;margin:6px 0 12px}label{display:block;color:#bbb;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #29292c;text-align:left}button.danger{background:#7a2020;color:#fff}.msg{color:#aaa;margin:8px 0}.hide{display:none}</style></head><body>
<div class="wrap"><div class="top"><h1>Categories</h1><div><a href="index.html">Dashboard</a> <button onclick="logoutUser()">Logout</button></div></div><div class="panel"><form id="form"><input type="hidden" id="id"><label>Name</label><input id="name" required><label>Slug</label><input id="slug" required><label>Sort Order</label><input id="sort_order" type="number" value="10"><button class="btn" type="submit">Save Category</button><button class="btn" type="button" onclick="resetForm()">New</button><div id="msg" class="msg"></div></form></div><div class="panel"><div id="list">Loading...</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><script>let editId=null;function resetForm(){editId=null;form.reset();sort_order.value=10}
async function load(){let r=await checkAdmin();if(!r.isAdmin){location.href="../login.html";return}let {data,error}=await supabaseClient.from("categories").select("*").order("sort_order");if(error){list.textContent=error.message;return}list.innerHTML=`<table><tr><th>Name</th><th>Slug</th><th>Action</th></tr>${(data||[]).map(c=>`<tr><td>${c.name}</td><td>${c.slug}</td><td><button onclick='edit(${JSON.stringify(c)})'>Edit</button> <button class="danger" onclick="del('${c.id}')">Delete</button></td></tr>`).join("")}</table>`}
function edit(c){editId=c.id;name.value=c.name;slug.value=c.slug;sort_order.value=c.sort_order;scrollTo(0,0)}
async function del(id){if(!confirm("Delete this category?"))return;let {error}=await supabaseClient.from("categories").delete().eq("id",id);if(error)alert(error.message);else load()}
form.onsubmit=async e=>{e.preventDefault();let obj={name:name.value.trim(),slug:slug.value.trim(),sort_order:Number(sort_order.value)||10};let q=editId?supabaseClient.from("categories").update(obj).eq("id",editId):supabaseClient.from("categories").insert(obj);let {error}=await q;if(error)msg.textContent=error.message;else{msg.textContent="Saved.";resetForm();load()}};load();</script></body></html>
