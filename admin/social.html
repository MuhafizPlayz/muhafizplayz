<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Links | Muhafız Playz Admin</title>
<link rel="stylesheet" href="admin.css?v=20261006">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Social Links</h1>
        <p class="sub">Links shown in your website footer. Leave blank to hide a link.</p>
      </div>
    </div>

    <div class="card">
      <form id="form">
        <div class="form-grid">
          <div><label class="l" for="facebook_url">Facebook URL</label><input type="url" id="facebook_url" placeholder="https://facebook.com/..."></div>
          <div><label class="l" for="whatsapp_url">WhatsApp URL</label><input type="url" id="whatsapp_url" placeholder="https://whatsapp.com/channel/..."></div>
          <div><label class="l" for="instagram_url">Instagram URL</label><input type="url" id="instagram_url" placeholder="https://instagram.com/..."></div>
          <div><label class="l" for="tiktok_url">TikTok URL</label><input type="url" id="tiktok_url" placeholder="https://tiktok.com/@..."></div>
          <div><label class="l" for="telegram_url">Telegram URL</label><input type="url" id="telegram_url" placeholder="https://t.me/..."></div>
          <div><label class="l" for="youtube_url">YouTube URL</label><input type="url" id="youtube_url" placeholder="https://youtube.com/@..."></div>
        </div>
        <div class="form-actions">
          <button class="btn primary" type="submit" id="saveBtn">Save Social Links</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=20261006"></script>
<script src="../js/auth.js?v=20261006"></script>
<script src="admin.js?v=20261006"></script>
<script>
var FIELDS = ["facebook_url", "whatsapp_url", "instagram_url", "tiktok_url", "telegram_url", "youtube_url"];
function $(id) { return document.getElementById(id); }

async function load() {
  var res = await supabaseClient.from("social_links").select("*").limit(1).maybeSingle();
  if (res.error) { toast(res.error.message, "err"); return; }
  if (res.data) FIELDS.forEach(function (k) { $(k).value = res.data[k] || ""; });
}

$("form").addEventListener("submit", async function (e) {
  e.preventDefault();
  $("saveBtn").disabled = true;

  var old = await supabaseClient.from("social_links").select("id").limit(1).maybeSingle();
  var obj = {};
  FIELDS.forEach(function (k) { obj[k] = $(k).value.trim() || null; });

  var q = old.data
    ? supabaseClient.from("social_links").update(obj).eq("id", old.data.id)
    : supabaseClient.from("social_links").insert(obj);
  var r = await q;

  $("saveBtn").disabled = false;
  if (r.error) toast(r.error.message, "err");
  else toast("Social links saved.");
});

(async function () {
  var ok = await requireAdmin();
  if (!ok) return;
  renderNav("social");
  load();
})();
</script>
</body>
</html>
