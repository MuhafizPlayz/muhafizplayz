<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Settings | Muhafız Playz Admin</title>
<link rel="stylesheet" href="admin.css?v=20261006">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Website Settings</h1>
        <p class="sub">General information and SEO settings for your website.</p>
      </div>
    </div>

    <form id="form">
      <div class="card">
        <h2>General</h2>
        <div class="form-grid">
          <div><label class="l" for="site_name">Site Name</label><input type="text" id="site_name"></div>
          <div><label class="l" for="site_url">Site URL</label><input type="url" id="site_url" placeholder="https://..."></div>
          <div class="full"><label class="l" for="logo_url">Logo URL</label><input type="text" id="logo_url"></div>
          <div class="full"><label class="l" for="description">Description</label><textarea id="description"></textarea></div>
          <div class="full"><label class="l" for="footer_text">Footer Text</label><input type="text" id="footer_text"></div>
        </div>
      </div>

      <div class="card">
        <h2>SEO</h2>
        <div class="form-grid">
          <div class="full"><label class="l" for="seo_title">SEO Title</label><input type="text" id="seo_title"></div>
          <div class="full"><label class="l" for="seo_description">SEO Description</label><textarea id="seo_description"></textarea></div>
          <div class="full"><label class="l" for="og_image_url">OG Image URL</label><input type="text" id="og_image_url"></div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn primary" type="submit" id="saveBtn">Save Website Settings</button>
      </div>
    </form>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=20261006"></script>
<script src="../js/auth.js?v=20261006"></script>
<script src="admin.js?v=20261006"></script>
<script>
var FIELDS = ["site_name", "logo_url", "description", "footer_text", "seo_title", "seo_description", "og_image_url", "site_url"];
function $(id) { return document.getElementById(id); }

async function load() {
  var res = await supabaseClient.from("site_settings").select("*").limit(1).maybeSingle();
  if (res.error) { toast(res.error.message, "err"); return; }
  if (res.data) FIELDS.forEach(function (k) { $(k).value = res.data[k] || ""; });
}

$("form").addEventListener("submit", async function (e) {
  e.preventDefault();
  $("saveBtn").disabled = true;

  var old = await supabaseClient.from("site_settings").select("id").limit(1).maybeSingle();
  var obj = {};
  FIELDS.forEach(function (k) { obj[k] = $(k).value.trim() || null; });
  obj.site_name = $("site_name").value.trim();

  var q = old.data
    ? supabaseClient.from("site_settings").update(obj).eq("id", old.data.id)
    : supabaseClient.from("site_settings").insert(obj);
  var r = await q;

  $("saveBtn").disabled = false;
  if (r.error) toast(r.error.message, "err");
  else toast("Website settings saved.");
});

(async function () {
  var ok = await requireAdmin();
  if (!ok) return;
  renderNav("settings");
  load();
})();
</script>
</body>
</html>
