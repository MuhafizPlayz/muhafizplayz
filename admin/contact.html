<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Muhafız Playz Admin</title>
<link rel="stylesheet" href="admin.css?v=20261006">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Contact Settings</h1>
        <p class="sub">Contact details shown on your website.</p>
      </div>
    </div>

    <div class="card">
      <form id="form">
        <div class="form-grid">
          <div>
            <label class="l" for="contact_label">Contact Label</label>
            <input type="text" id="contact_label" placeholder="e.g. Business Inquiries">
          </div>
          <div>
            <label class="l" for="contact_email">Contact Email</label>
            <input type="email" id="contact_email" placeholder="name@example.com">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn primary" type="submit" id="saveBtn">Save Contact Settings</button>
        </div>
      </form>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js?v=20261006"></script>
<script src="../js/auth.js?v=20261006"></script>
<script src="admin.js?v=20261006"></script>
<script>
function $(id) { return document.getElementById(id); }

async function load() {
  var res = await supabaseClient.from("contact_settings").select("*").limit(1).maybeSingle();
  if (res.error) { toast(res.error.message, "err"); return; }
  if (res.data) {
    $("contact_label").value = res.data.contact_label || "";
    $("contact_email").value = res.data.contact_email || "";
  }
}

$("form").addEventListener("submit", async function (e) {
  e.preventDefault();
  $("saveBtn").disabled = true;

  var old = await supabaseClient.from("contact_settings").select("id").limit(1).maybeSingle();
  var obj = {
    contact_label: $("contact_label").value.trim() || null,
    contact_email: $("contact_email").value.trim() || null
  };
  var q = old.data
    ? supabaseClient.from("contact_settings").update(obj).eq("id", old.data.id)
    : supabaseClient.from("contact_settings").insert(obj);
  var r = await q;

  $("saveBtn").disabled = false;
  if (r.error) toast(r.error.message, "err");
  else toast("Contact settings saved.");
});

(async function () {
  var ok = await requireAdmin();
  if (!ok) return;
  renderNav("contact");
  load();
})();
</script>
</body>
</html>
