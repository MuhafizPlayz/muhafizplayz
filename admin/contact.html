<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Settings | Muhafız Playz</title><style>body{margin:0;background:#0e0e0f;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 30px));margin:auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.top a,.top button,.btn{padding:10px 14px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}.panel{background:#171719;border:1px solid #29292c;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #333;background:#101011;color:#fff;margin:6px 0 12px}label{display:block;color:#bbb;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #29292c;text-align:left}button.danger{background:#7a2020;color:#fff}.msg{color:#aaa;margin:8px 0}.hide{display:none}</style></head><body>
<div class="wrap"><div class="top"><h1>Contact Settings</h1><div><a href="index.html">Dashboard</a> <button onclick="logoutUser()">Logout</button></div></div><div class="panel"><form id="form"><label>Contact Label</label><input id="contact_label"><label>Contact Email</label><input id="contact_email" type="email"><button class="btn">Save Contact Settings</button><div id="msg" class="msg"></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><script>async function load(){let r=await checkAdmin();if(!r.isAdmin){location.href="../login.html";return}let {data,error}=await supabaseClient.from("contact_settings").select("*").limit(1).maybeSingle();if(error){msg.textContent=error.message;return}if(data){contact_label.value=data.contact_label||"";contact_email.value=data.contact_email||""}}
form.onsubmit=async e=>{e.preventDefault();let {data:old}=await supabaseClient.from("contact_settings").select("id").limit(1).maybeSingle();let obj={contact_label:contact_label.value.trim()||null,contact_email:contact_email.value.trim()||null};let q=old?supabaseClient.from("contact_settings").update(obj).eq("id",old.id):supabaseClient.from("contact_settings").insert(obj);let {error}=await q;msg.textContent=error?error.message:"Saved."};load();</script></body></html>
