<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dramas | Muhafız Playz</title><style>body{margin:0;background:#0e0e0f;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 30px));margin:auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:25px}.top a,.top button,.btn{padding:10px 14px;border:0;border-radius:8px;text-decoration:none;cursor:pointer}.panel{background:#171719;border:1px solid #29292c;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #333;background:#101011;color:#fff;margin:6px 0 12px}label{display:block;color:#bbb;margin-top:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #29292c;text-align:left}button.danger{background:#7a2020;color:#fff}.msg{color:#aaa;margin:8px 0}.hide{display:none}</style></head><body>
<div class="wrap"><div class="top"><h1>Dramas</h1><div><a href="index.html">Dashboard</a> <button onclick="logoutUser()">Logout</button></div></div><div class="panel"><form id="form"><input type="hidden" id="id"><label>Title</label><input id="title" required><label>Slug</label><input id="slug" required><label>Urdu Title</label><input id="urdu_title"><label>Original Title</label><input id="original_title"><label>Poster URL</label><input id="poster_url"><label>Description</label><textarea id="description"></textarea><label>Genre</label><input id="genre"><label>Category</label><select id="category"></select><label>Year</label><input id="year" type="number"><label>Status</label><input id="status" value="Ongoing"><label><input id="published" type="checkbox"> Published</label><label><input id="featured" type="checkbox"> Featured</label><label><input id="coming_soon" type="checkbox"> Coming Soon</label><label><input id="previous_show" type="checkbox"> Previous Show</label><button class="btn" type="submit">Save Drama</button> <button class="btn" type="button" onclick="resetForm()">New</button><div class="msg" id="msg"></div></form></div><div class="panel"><div id="list">Loading...</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/auth.js"></script><script>let editId=null;
async function loadCats(){let {data,error}=await supabaseClient.from("categories").select("name,slug").order("sort_order");if(error){msg.textContent=error.message;return}category.innerHTML=(data||[]).map(x=>`<option value="${x.name.replace(/"/g,"&quot;")}">${x.name}</option>`).join("")}
function resetForm(){editId=null;form.reset();id.value=""}
async function load(){let r=await checkAdmin();if(!r.isAdmin){location.href="../login.html";return}await loadCats();let {data,error}=await supabaseClient.from("dramas").select("*").order("sort_order").order("created_at",{ascending:false});if(error){list.textContent=error.message;return}list.innerHTML=`<table><tr><th>Title</th><th>Category</th><th>Published</th><th>Action</th></tr>${(data||[]).map(d=>`<tr><td>${d.title}</td><td>${d.category}</td><td>${d.published?"Yes":"No"}</td><td><button onclick='edit(${JSON.stringify(d)})'>Edit</button> <button class="danger" onclick="del('${d.id}')">Delete</button></td></tr>`).join("")}</table>`}
function edit(d){editId=d.id;for(const k of ["title","slug","urdu_title","original_title","poster_url","description","genre","category","year","status"])if(document.getElementById(k))document.getElementById(k).value=d[k]??"";published.checked=!!d.published;featured.checked=!!d.featured;coming_soon.checked=!!d.coming_soon;previous_show.checked=!!d.previous_show;scrollTo(0,0)}
async function del(id){if(!confirm("Delete this drama?"))return;let {error}=await supabaseClient.from("dramas").delete().eq("id",id);if(error)alert(error.message);else load()}
form.onsubmit=async e=>{e.preventDefault();let obj={title:title.value.trim(),slug:slug.value.trim(),urdu_title:urdu_title.value.trim()||null,original_title:original_title.value.trim()||null,poster_url:poster_url.value.trim()||null,description:description.value.trim()||null,genre:genre.value.trim()||null,category:category.value,year:year.value?Number(year.value):null,status:status.value.trim()||"Ongoing",published:published.checked,featured:featured.checked,coming_soon:coming_soon.checked,previous_show:previous_show.checked};let q=editId?supabaseClient.from("dramas").update(obj).eq("id",editId):supabaseClient.from("dramas").insert(obj);let {error}=await q;if(error)msg.textContent=error.message;else{msg.textContent="Saved.";resetForm();load()}}
load();</script></body></html>
