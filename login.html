<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Muhafız Playz Official</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #1a1a2e 0%, #0b0b12 60%);
      color: #f1f1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #14141f;
      border: 1px solid #26263a;
      border-radius: 16px;
      padding: 32px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 14px;
      color: #9a9ab0;
      margin-bottom: 24px;
    }

    .field {
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #b4b4c8;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      color: #f1f1f5;
      background: #0d0d16;
      border: 1px solid #2c2c44;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: #e63946; }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #e63946;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover { background: #cf2f3c; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .message {
      display: none;
      margin-top: 16px;
      padding: 11px 13px;
      font-size: 14px;
      line-height: 1.4;
      border-radius: 10px;
      text-align: left;
      word-wrap: break-word;
    }

    .message.error {
      display: block;
      color: #ffb3b9;
      background: rgba(230, 57, 70, 0.12);
      border: 1px solid rgba(230, 57, 70, 0.4);
    }

    .message.status {
      display: block;
      color: #b8c7ff;
      background: rgba(90, 120, 255, 0.12);
      border: 1px solid rgba(90, 120, 255, 0.35);
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      color: #9a9ab0;
      text-decoration: none;
    }

    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="login-card">
    <img class="logo" src="assets/logo/logo.png" alt="Muhafız Playz Official"
         onerror="this.style.display='none'">
    <h1>Muhafız Playz Official</h1>
    <p class="subtitle">Admin Login</p>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email"
             autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password"
             autocomplete="current-password" required>
    </div>

    <button type="button" id="loginBtn">Login</button>

    <div id="errorMessage" class="message" role="alert"></div>
    <div id="statusMessage" class="message" role="status"></div>

    <a class="back-link" href="index.html">&larr; Back to website</a>
  </div>

  <!-- 1. Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. Existing Supabase config (defines supabaseClient) -->
  <script src="js/config.js?v=20261006"></script>
  <!-- 3. Auth logic -->
  <script src="js/auth.js?v=20261006"></script>

  <script>
    (function () {
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var loginBtn = document.getElementById("loginBtn");
      var errorBox = document.getElementById("errorMessage");
      var statusBox = document.getElementById("statusMessage");

      function showError(text) {
        statusBox.className = "message";
        statusBox.textContent = "";
        errorBox.className = "message error";
        errorBox.textContent = text;
      }

      function showStatus(text) {
        errorBox.className = "message";
        errorBox.textContent = "";
        statusBox.className = "message status";
        statusBox.textContent = text;
      }

      function clearMessages() {
        errorBox.className = "message";
        errorBox.textContent = "";
        statusBox.className = "message";
        statusBox.textContent = "";
      }

      async function handleLogin() {
        clearMessages();

        var email = emailInput.value.trim();
        var password = passwordInput.value;

        if (!email || !password) {
          showError("Please enter both email and password.");
          return;
        }

        if (typeof loginUser !== "function") {
          showError("Login script failed to load. Please hard refresh the page (Ctrl+Shift+R) and try again.");
          return;
        }

        loginBtn.disabled = true;
        showStatus("Logging in...");

        try {
          var result = await loginUser(email, password);

          if (!result.ok) {
            showError(result.error);
            loginBtn.disabled = false;
            return;
          }

          showStatus("Login successful. Redirecting to admin dashboard...");
          window.location.replace("admin/index.html");
        } catch (err) {
          showError((err && err.message) ? err.message : "Unexpected error during login.");
          loginBtn.disabled = false;
        }
      }

      loginBtn.addEventListener("click", handleLogin);

      [emailInput, passwordInput].forEach(function (input) {
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            handleLogin();
          }
        });
      });
    })();
  </script>
</body>
</html>
